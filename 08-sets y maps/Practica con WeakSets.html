<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        
        let ws = new WeakSet();

        let usuario = { nombre: "Fernando" };
        let producto = { nombre: "Laptop" };

        ws.add(usuario);
        ws.add(producto);

        console.log(ws.has(usuario));
        console.log(ws.has(producto));

        ws.delete(usuario);

        console.log(ws.has(usuario));
        
    </script>


</body>
</html>
