<script>

let frutas = new Set(["manzana", "banana", "naranja", "manzana", "banana"]);

console.log(frutas);

frutas.add("uva");
frutas.add("manzana");

console.log(frutas);

console.log(frutas.has("banana"));
console.log(frutas.has("sandía"));

console.log(frutas.size);

for (let fruta of frutas) {
    console.log(fruta);
}

frutas.delete("banana");
console.log(frutas);

let notas = [8, 9, 7, 8, 10, 7, 9, 6];
let notasUnicas = [...new Set(notas)];
console.log(notasUnicas);

let arrayFrutas = Array.from(frutas);
console.log(arrayFrutas);


</script>
