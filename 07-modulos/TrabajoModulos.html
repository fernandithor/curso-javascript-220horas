<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  
    <script type="module">

        import {calculo_IVA} from "./Calculos_financieros.js";

        

        let contenedor=document.getElementById("espacio");

        let origen=document.getElementById("origen");

        let elBoton=document.getElementById("conversor");

        elBoton.addEventListener("click", ()=>{

            
            contenedor.innerHTML=parseInt(origen.value)+calculo_IVA(origen.value);

        })


    </script>

    <input type="text" id="origen"><br/><br/>

    <button id="conversor">Calcular</button>

    <br/><br/>

    <div id="espacio">



    </div>


</body>
</html>
