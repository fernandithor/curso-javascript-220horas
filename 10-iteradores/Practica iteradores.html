<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

<body>
    
    <script>

        const nums = [1, 2, 3];
        const iter = nums[Symbol.iterator]();

        console.log(iter.next());
        console.log(iter.next());
        console.log(iter.next());
        console.log(iter.next());

        for (const n of nums) {
        console.log(n);
        }

        function* contar() {
        yield 1;
        yield 2;
        yield 3;
        }

        const gen = contar();
        console.log(gen.next());
        console.log(gen.next());
        console.log(gen.next());


    </script>


</body>
</html>
