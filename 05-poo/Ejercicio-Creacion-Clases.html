<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

    class Vehiculo {

        constructor(modelo, marca, precio, km) {
            this.modelo = modelo;
            this.marca   = marca;
            this.precio  = precio;
            this.km      = km;
        }

        getModelo() { return this.modelo; }
        getMarca()  { return this.marca;  }
        getPrecio() { return this.precio; }
        getKm()     { return this.km;     }

        setModelo(modelo) { this.modelo = modelo; }
        setMarca(marca)   { this.marca  = marca;  }
        setPrecio(precio) { this.precio = precio; }
        setKm(km)         { this.km     = km;     }

        mostrarInfo() {
            console.log(this.marca + " " + this.modelo);
        }

    }
   class Furgoneta extends Vehiculo {

        constructor(modelo, marca, precio, km, carga) {
            super(modelo, marca, precio, km);
            this.carga = carga;  
        }

        getCarga()        { return this.carga; }
        setCarga(carga)   { this.carga = carga; }

        mostrarInfo() {
            console.log(this.marca + " " + this.modelo + " - Carga: " + this.carga + "kg");
        }
    }

    const furgo1 = new Furgoneta("Sprinter", "Mercedes", 30000, 50000, 1500);
    furgo1.mostrarInfo(); 

    console.log(furgo1.getMarca());
    console.log(furgo1.getCarga());

    furgo1.setCarga(2000);
    console.log(furgo1.getCarga());


</script>

</body>
</html>
